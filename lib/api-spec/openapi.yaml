        ride:
          allOf:
            - $ref: '#/components/schemas/AcceptedBiddingRide'
        bid: { $ref: '#/components/schemas/BiddingBid' }
    AcceptedBiddingRide:
      type: object
      description: |
        Ride row after the rider accepted a bid. Status is `driver_arriving`,
        `acceptedBidId` and `acceptedDriverId` point at the winning offer.
        Includes the full `bids` array so the rider client can stay in sync
        without a follow-up GET.
      required:
        - id
        - riderId
        - pickupLabel
        - pickupAddress
        - dropoffLabel
        - dropoffAddress
        - estimatedDistanceKm
        - estimatedDurationMin
        - status
        - acceptedBidId
        - acceptedDriverId
        - bids
        - createdAt
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        pickupLabel: { type: string }
        pickupAddress: { type: string }
        dropoffLabel: { type: string }
        dropoffAddress: { type: string }
        pickupLat: { type: number, nullable: true }
        pickupLng: { type: number, nullable: true }
        dropoffLat: { type: number, nullable: true }
        dropoffLng: { type: number, nullable: true }
        routePolyline: { type: string, nullable: true }
        estimatedDistanceKm: { type: number }
        estimatedDurationMin: { type: integer }
        status:
          type: string
          enum: [bidding, driver_arriving, in_progress, completed, cancelled, queued, assigned_next]
        acceptedBidId: { type: string, format: uuid, nullable: true }
        acceptedDriverId: { type: string, format: uuid, nullable: true }
        finalAmount: { type: number, nullable: true }
        initialFare: { type: number, nullable: true }
        biddingExpiresAt: { type: string, format: date-time, nullable: true }
        bids:
          type: array
          items: { $ref: '#/components/schemas/BiddingBid' }
        createdAt: { type: string, format: date-time }
