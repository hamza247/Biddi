openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Auth
    description: Authentication, signup wizard, and password/biometric login.
  - name: Referrals
    description: 3-level referral rewards program.
  - name: NotificationSounds
    description: Notification sound library, manifest, and active assignments.
  - name: Heatmap
    description: Real-time driver demand/surge heatmap.
  - name: AirportSurcharges
    description: Admin CRUD for airport zones and per-vehicle airport surcharges.
  - name: UserSettings
    description: Per-user preferences such as customised quick-reply chat phrases.
  - name: Currencies
    description: Admin currency catalog — list/create/update/delete currencies and choose the platform default.
  - name: TripChat
    description: |
      Real-time in-trip chat between rider and accepted driver. Supports text,
      image, and voice messages with delivery/read receipts (✓/✓✓/blue ✓✓),
      typing indicators, and unread badges. Chat is ephemeral — messages are
      only readable while the trip status is `driver_arriving` or `in_progress`.
  - name: Bidding
    description: |
      inDrive-style bidding flow. Riders post a price for a trip; nearby
      drivers respond with offers (matching or counter-offering); the rider
      picks one. Offers age out via the bidding-expiry job, and bidding
      posts auto-cancel after their deadline if no offer is accepted.
paths:
  /rides/{id}/rate-customer:
    post:
      tags: [Rides]
      operationId: rateCustomer
      summary: Driver rates a rider after a completed trip.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Rating saved.
          content:
            application/json:
              schema:
                type: object
                required: [ride]
                properties:
                  ride: { type: object }
        '403':
          description: Caller is not the accepted driver or ride not found.
        '409':
          description: Ride not completed or already rated.
  /drivers/{driverId}/rating-summary:
    get:
      tags: [Rides]
      operationId: getDriverRatingSummary
      summary: Get a driver's aggregate rating summary.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Driver rating summary.
          content:
            application/json:
              schema:
                type: object
                required: [averageRating, ratingCount]
                properties:
                  averageRating: { type: number }
                  ratingCount: { type: integer, minimum: 0 }
        '404':
          description: Driver not found.
  /users/{userId}/rating-summary:
    get:
      tags: [Rides]
      operationId: getUserRatingSummary
      summary: Get a user's aggregate customer (rider) rating summary.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Customer rating summary.
          content:
            application/json:
              schema:
                type: object
                required: [averageRating, ratingCount]
                properties:
                  averageRating: { type: number, nullable: true }
                  ratingCount: { type: integer, minimum: 0 }
        '404':
          description: User not found.
  /admin/airport-locations:
    get:
      tags: [AirportSurcharges]
      operationId: listAirportLocations
      summary: List configured airport zones (service areas of type airport_surcharge).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of airport zones with center+radius set.
          content:
            application/json:
              schema:
                type: object
                required: [airports]
                properties:
                  airports:
                    type: array
                    items: { $ref: '#/components/schemas/AirportLocation' }
    post:
      tags: [AirportSurcharges]
      operationId: createAirportLocation
      summary: Create a new airport zone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAirportLocationRequest' }
      responses:
        '201':
          description: Created airport zone.
          content:
            application/json:
              schema:
                type: object
                required: [airport]
                properties:
                  airport: { $ref: '#/components/schemas/AirportLocation' }
  /admin/airport-surcharges:
    get:
      tags: [AirportSurcharges]
      operationId: listAirportSurcharges
      summary: List all airport surcharge rules.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of airport surcharges joined with airport + vehicle type names.
          content:
            application/json:
              schema:
                type: object
                required: [surcharges]
                properties:
                  surcharges:
                    type: array
                    items: { $ref: '#/components/schemas/AirportSurcharge' }
    post:
      tags: [AirportSurcharges]
      operationId: createAirportSurcharge
      summary: Create a new airport surcharge for an (airport, vehicle type) pair.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirportSurchargeInput' }
      responses:
        '201':
          description: Created surcharge.
          content:
            application/json:
              schema:
                type: object
                required: [surcharge]
                properties:
                  surcharge: { $ref: '#/components/schemas/AirportSurcharge' }
        '409':
          description: A surcharge for this airport + vehicle type already exists.
  /admin/airport-surcharges/{id}:
    get:
      tags: [AirportSurcharges]
      operationId: getAirportSurcharge
      summary: Fetch a single airport surcharge by id.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Single surcharge.
          content:
            application/json:
              schema:
                type: object
                required: [surcharge]
                properties:
                  surcharge: { $ref: '#/components/schemas/AirportSurcharge' }
        '404':
          description: Not found.
    put:
      tags: [AirportSurcharges]
      operationId: replaceAirportSurcharge
      summary: Full replace of an airport surcharge.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirportSurchargeInput' }
      responses:
        '200':
          description: Updated surcharge.
          content:
            application/json:
              schema:
                type: object
                required: [surcharge]
                properties:
                  surcharge: { $ref: '#/components/schemas/AirportSurcharge' }
        '404':
          description: Not found.
        '409':
          description: Duplicate airport and vehicle type pair.
    patch:
      tags: [AirportSurcharges]
      operationId: updateAirportSurcharge
      summary: Partial update of an airport surcharge.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AirportSurchargeInput' }
      responses:
        '200':
          description: Updated surcharge.
          content:
            application/json:
              schema:
                type: object
                required: [surcharge]
                properties:
                  surcharge: { $ref: '#/components/schemas/AirportSurcharge' }
        '404':
          description: Not found.
        '409':
          description: Duplicate airport and vehicle type pair.
    delete:
      tags: [AirportSurcharges]
      operationId: deleteAirportSurcharge
      summary: Delete an airport surcharge.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deletion ack.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /admin/airport-surcharges/{id}/status:
    patch:
      tags: [AirportSurcharges]
      operationId: setAirportSurchargeStatus
      summary: Toggle the active flag of an airport surcharge.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAirportSurchargeStatusRequest' }
      responses:
        '200':
          description: Updated surcharge.
          content:
            application/json:
              schema:
                type: object
                required: [surcharge]
                properties:
                  surcharge: { $ref: '#/components/schemas/AirportSurcharge' }

  /demand-zones:
    get:
      tags: [Heatmap]
      operationId: getDemandZones
      summary: Real-time surge demand zones for the driver home heatmap.
      description: |
        Snapshot of the latest aggregated demand-vs-supply zones. Updated by a
        server-side aggregator on a fixed interval (see admin Heatmap settings).
        The same data is broadcast as diffs over Socket.IO room
        `drivers:heatmap`. Capped to ~200 zones, ordered by surgeMultiplier
        descending.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Latest demand-zone snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandZoneSnapshot'

  /referrals/me:
    get:
      tags: [Referrals]
      operationId: getMyReferrals
      summary: Get the signed-in user's referral code, totals, and recent earnings.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Referral summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralsMeResponse'
  /me/referrals:
    get:
      tags: [Referrals]
      operationId: getMyReferralsAlias
      summary: Alias of GET /referrals/me matching the task contract.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Referral summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralsMeResponse'
  /referrals/tree:
    get:
      tags: [Referrals]
      operationId: getReferralTree
      summary: Get the 3-level referral tree for a user.
      description: |
        Returns the referral tree rooted at the signed-in user (members),
        or at the user identified by `userId` (admins only). Tree depth is
        capped at 3 levels.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: userId
          required: false
          schema: { type: string, format: uuid }
          description: Admin-only override. Non-admin callers may only fetch their own tree.
      responses:
        '200':
          description: Referral tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralTreeResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Non-admin tried to read another user's tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/mlm-report/search:
    get:
      tags: [Referrals]
      operationId: adminSearchMlmReportUsers
      summary: Search users / drivers as candidates for the root of an MLM report.
      description: |
        Lightweight search by name, phone, email, or referral code, scoped to
        the admin MLM report page. Returns up to 20 matches.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Matched users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlmReportSearchResponse'
  /admin/mlm-report/{userId}:
    get:
      tags: [Referrals]
      operationId: adminGetMlmReport
      summary: Get a multi-level MLM referral report rooted at a user.
      description: |
        Builds a downline tree up to `depth` levels deep (default 3, max 6).
        Useful for power users who need to audit beyond the standard 3-level
        commission window.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: depth
          required: false
          schema: { type: integer, minimum: 1, maximum: 6, default: 3 }
      responses:
        '200':
          description: MLM report shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlmReportResponse'
        '404':
          description: Root user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/mlm-report/{userId}/earnings:
    get:
      tags: [Referrals]
      operationId: adminGetMlmReportUserEarnings
      summary: Per-ride referral earnings for a specific downline member.
      description: |
        Returns every referral_earnings row credited to the given user
        (newest first), so admins can audit which rides drove their earnings
        from the MLM report drill-down.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Earnings rows for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlmReportUserEarningsResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/referral-levels:
    get:
      tags: [Referrals]
      operationId: adminListReferralLevels
      summary: List the configured referral levels.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configured levels.
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferralLevel'
  /admin/referral-levels/{level}:
    put:
      tags: [Referrals]
      operationId: adminUpsertReferralLevel
      summary: Update one referral level (1, 2 or 3).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: level
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferralLevelRequest'
      responses:
        '200':
          description: Updated level.
          content:
            application/json:
              schema:
                type: object
                required: [level]
                properties:
                  level:
                    $ref: '#/components/schemas/ReferralLevel'
  /admin/referral-earnings:
    get:
      tags: [Referrals]
      operationId: adminListReferralEarnings
      summary: List referral earnings with optional date / level / user / ride filters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: level
          schema: { type: integer, minimum: 1, maximum: 3 }
        - in: query
          name: userId
          schema: { type: string, format: uuid }
        - in: query
          name: rideId
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Filtered earnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralEarningsListResponse'
  /admin/referral-earnings/summary:
    get:
      tags: [Referrals]
      operationId: adminReferralEarningsSummary
      summary: Aggregate totals (overall and per level) honoring the same filters as list.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: level
          schema: { type: integer, minimum: 1, maximum: 3 }
        - in: query
          name: userId
          schema: { type: string, format: uuid }
        - in: query
          name: rideId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregated totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralEarningsSummaryResponse'
  /auth/check-email:
    post:
      tags: [Auth]
      operationId: checkEmail
      summary: Check whether an email is already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmailRequest'
      responses:
        '200':
          description: Existence flag for the email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailExistsResult'
        '400':
          description: Missing or malformed email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: passwordLogin
      summary: Sign in with email and password.
      description: |
        Verifies the bcrypt-hashed password and returns a session token. Used
        by both the riders and drivers app for non-OTP sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many login attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/complete-profile:
    post:
      tags: [Auth]
      operationId: completeProfile
      summary: Set email + password (and optional referral) for a phone-only account.
      description: |
        Used by the new signup wizard and by the legacy "complete profile"
        prompt for users who originally signed up with phone-only OTP. Requires
        a valid bearer token from a previous OTP verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
      responses:
        '200':
          description: Profile completed; returns updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '400':
          description: |
            Validation error. The `error` field is one of:
            `email_taken`, `weak_password`, `invalid_referral`, `invalid_email`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /site/settings:
    get:
      tags: [Site]
      operationId: getSiteSettings
      summary: Public site-wide settings (brand, social, maintenance).
      responses:
        '200':
          description: Site settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: '#/components/schemas/SiteSettings'
  /site/pages:
    get:
      tags: [Site]
      operationId: listSitePages
      summary: List published site pages for the given language.
      parameters:
        - in: query
          name: lang
          schema: { type: string, enum: [en, fr, ar] }
          required: false
      responses:
        '200':
          description: Pages list (slug + metadata only).
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: '#/components/schemas/SitePageSummary' }
  /site/pages/{lang}/{slug}:
    get:
      tags: [Site]
      operationId: getSitePageBySlug
      summary: Fetch a single published site page by language + slug.
      parameters:
        - in: path
          name: lang
          required: true
          schema: { type: string, enum: [en, fr, ar] }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Page content.
          content:
            application/json:
              schema:
                type: object
                required: [page]
                properties:
                  page: { $ref: '#/components/schemas/SitePage' }
        '404':
          description: Page not found or unpublished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  # Note: /sitemap.xml and /robots.txt are intentionally NOT in this
  # OpenAPI spec. They are mounted at the site root (no /api prefix)
  # by the api-server so crawlers can fetch them directly, and there is
  # no client-side use case that requires generated bindings.
  /site/contact:
    post:
      tags: [Site]
      operationId: postSiteContact
      summary: Submit a contact form message from the marketing site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteContactRequest' }
      responses:
        '200':
          description: Submission accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteContactResponse' }
        '400':
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/site/pages:
    get:
      tags: [SiteAdmin]
      operationId: adminListSitePages
      summary: List all CMS pages (admin-only).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All pages (both languages, all statuses).
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: '#/components/schemas/SitePageSummary' }
    post:
      tags: [SiteAdmin]
      operationId: adminCreateSitePage
      summary: Create a new CMS page.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSitePageUpsert' }
      responses:
        '201':
          description: Created page.
          content:
            application/json:
              schema:
                type: object
                required: [page]
                properties:
                  page: { $ref: '#/components/schemas/SitePage' }
        '409':
          description: A page with that slug + lang already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/site/pages/{slug}/{lang}:
    get:
      tags: [SiteAdmin]
      operationId: adminGetSitePage
      summary: Fetch a single CMS page (any status).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: path
          name: lang
          required: true
          schema: { type: string, enum: [en, fr, ar] }
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                type: object
                required: [page]
                properties:
                  page: { $ref: '#/components/schemas/SitePage' }
        '404':
          description: Not found.
          content:
            application/json:
