      tags: [Currencies]
      operationId: setAdminCurrencyDefault
      summary: Mark this currency as the platform default (updates app_settings.displayCurrency).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Default updated; refreshed list returned for one-shot UI sync.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCurrencySetDefaultResponse' }
        '404':
          description: Currency not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Currency is inactive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /trips/{tripId}/messages:
    get:
      tags: [TripChat]
      operationId: listTripMessages
      summary: List trip chat history (ephemeral — empty for inactive trips).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages array (empty when trip is not active).
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/TripChatMessage' }
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
    post:
      tags: [TripChat]
      operationId: createTripMessage
      summary: Send a chat message in an active trip.
      description: |
        Rate-limited to 30 messages / minute / (user, trip). Returns 429 with
        a `Retry-After` header when exceeded. Recipient receives a realtime
        `trip:message` socket event and (when offline / not in chat) a push.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripMessageRequest' }
      responses:
        '201':
          description: Message created and broadcast.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/TripChatMessage' }
        '200':
          description: |
            Idempotent replay — a previous request with the same `clientId`
            already created this message. The original row is returned and no
            new broadcast / push is sent.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/TripChatMessage' }
        '400': { description: Invalid body }
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
        '409': { description: Trip is not active }
        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the next message may be sent.
          content:
            application/json:
              schema:
                type: object
                required: [error, retryAfterMs]
                properties:
                  error: { type: string }
                  retryAfterMs: { type: integer }
  /trips/{tripId}/unread-count:
    get:
      tags: [TripChat]
      operationId: getTripUnreadCount
      summary: Per-trip unread chat count for the caller.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Unread count (0 for inactive trips).
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
  /chat/unread-count:
    get:
      tags: [TripChat]
      operationId: getGlobalUnreadCount
      summary: Aggregate unread chat count across all active trips.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Total + per-trip breakdown.
          content:
            application/json:
              schema:
                type: object
                required: [unread, byTrip]
                properties:
                  unread: { type: integer, minimum: 0 }
                  byTrip:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
  /trips/{tripId}/messages/mark-read:
    post:
      tags: [TripChat]
      operationId: markTripMessagesRead
      summary: Mark peer messages in a trip as read (and delivered).
      description: |
        Marks every message sent by the peer up to and including
        `upToMessageId` (or all if omitted) as read. Emits `chat:message:read`
        to the sender (✓✓ blue) and `chat:unread:update` with the actual
        remaining unread count for the caller.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkTripMessagesReadRequest' }
      responses:
        '200':
          description: Updated count + remaining unread.
          content:
            application/json:
              schema:
                type: object
                required: [updated, messageIds, unread]
                properties:
                  updated: { type: integer, minimum: 0 }
                  messageIds:
                    type: array
                    items: { type: string, format: uuid }
                  unread:
                    type: integer
                    minimum: 0
                    description: Remaining unread peer messages for the caller after this update.
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
        '404': { description: upToMessageId not found in trip }
  /storage/uploads/chat-request-url:
    post:
      tags: [TripChat]
      operationId: requestChatUploadUrl
      summary: Presigned upload URL for a chat image or voice attachment.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatUploadRequest' }
      responses:
        '200':
          description: Presigned URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatUploadResponse' }
        '400': { description: Invalid body / unsupported MIME / file too large }
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
        '409': { description: Trip is not active }
  /storage/uploads/chat-finalize:
    post:
      tags: [TripChat]
      operationId: finalizeChatUpload
      summary: Finalize a chat attachment upload (set ACL).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatFinalizeRequest' }
      responses:
        '200':
          description: Normalized object path.
          content:
            application/json:
              schema:
                type: object
                required: [objectPath]
                properties:
                  objectPath: { type: string }
        '400': { description: Invalid body }
        '401': { description: Unauthenticated }
        '403': { description: Caller is not a trip participant }
        '409': { description: Trip is not active }
  /me/quick-replies:
    get:
      tags: [UserSettings]
      operationId: getMyQuickReplies
      summary: Get the signed-in user's customised chat quick-reply lists.
      description: |
        Returns the user's saved quick-reply phrases for both the rider and
        driver chat sides. When the user has never edited a side the
        corresponding array is empty and clients should fall back to the
        built-in defaults.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quick reply lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickRepliesResponse' }
        '401': { description: Unauthenticated }
    put:
      tags: [UserSettings]
      operationId: updateMyQuickReplies
      summary: Replace the signed-in user's quick-reply list for one role.
      description: |
        Replaces the saved phrases for either the rider or driver chat side.
        Entries are trimmed, blanks dropped, clipped to 60 characters, and
        capped at 12 items. Returns the persisted lists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuickRepliesRequest' }
      responses:
        '200':
          description: Updated quick reply lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickRepliesResponse' }
        '400': { description: Invalid body }
        '401': { description: Unauthenticated }
  /bidding/nearby:
    get:
      tags: [Bidding]
      operationId: getBiddingNearby
      summary: List active bidding rides within driver's radius.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: radiusKm
          required: false
          schema:
            type: number
            minimum: 0.5
            maximum: 25
            default: 5
      responses:
        '200':
          description: Nearby bidding rides sorted by distance ascending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiddingNearbyResponse' }
        '403': { description: Not an approved driver }
        '409': { description: No live driver position available }
  /bidding/offers:
    post:
      tags: [Bidding]
      operationId: createBiddingOffer
      summary: Driver posts (or counter-offers) a bid on a bidding ride.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBiddingOfferBody' }
      responses:
        '201':
          description: Bid created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiddingOfferResponse' }
        '400': { description: Invalid input or bid violates fare bounds }
        '403': { description: Driver not approved or not online }
        '404': { description: Ride not found }
        '409': { description: Ride is no longer accepting bids }
        '410': { description: Bidding deadline has passed }
  /bidding/offers/{bidId}/withdraw:
    post:
      tags: [Bidding]
      operationId: withdrawBiddingOffer
      summary: Driver withdraws an active bid.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bidId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bid cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiddingOfferResponse' }
        '403': { description: Not the bid owner }
        '404': { description: Bid not found }
        '409': { description: Bid is not active }
  /bidding/posts/{rideId}/accept-offer:
    post:
      tags: [Bidding]
      operationId: acceptBiddingOffer
      summary: Rider accepts one driver's offer; other active bids are rejected.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: rideId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptBiddingOfferBody' }
      responses:
        '200':
          description: Bid accepted; ride moves to driver_arriving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptBiddingOfferResponse' }
        '403': { description: Not the ride owner }
        '404': { description: Ride or bid not found }
        '409': { description: Ride is no longer in bidding state }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AirportLocation:
      type: object
      required: [id, name, country, centerLat, centerLng, radiusM, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        centerLat: { type: number }
        centerLng: { type: number }
        radiusM: { type: integer, minimum: 1 }
        active: { type: boolean }
    CreateAirportLocationRequest:
      type: object
      required: [name, centerLat, centerLng, radiusM]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        centerLat: { type: number, minimum: -90, maximum: 90 }
        centerLng: { type: number, minimum: -180, maximum: 180 }
        radiusM: { type: integer, minimum: 1, maximum: 50000 }
        active: { type: boolean }
    AirportSurcharge:
      type: object
      required:
        - id
        - airportLocationId
        - vehicleTypeId
        - surchargeType
        - pickupSurchargeValue
        - dropoffSurchargeValue
        - active
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        airportLocationId: { type: string, format: uuid }
        airportName: { type: string, nullable: true }
        vehicleTypeId: { type: string, format: uuid }
        vehicleTypeName: { type: string, nullable: true }
        surchargeType: { type: string, enum: [multiplier, fixed] }
        pickupSurchargeValue: { type: number, exclusiveMinimum: 0 }
        dropoffSurchargeValue: { type: number, exclusiveMinimum: 0 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AirportSurchargeInput:
      type: object
      properties:
        airportLocationId: { type: string, format: uuid }
        vehicleTypeId: { type: string, format: uuid }
        surchargeType: { type: string, enum: [multiplier, fixed] }
        pickupSurchargeValue: { type: number, exclusiveMinimum: 0 }
        dropoffSurchargeValue: { type: number, exclusiveMinimum: 0 }
        active: { type: boolean }
    SetAirportSurchargeStatusRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    ReferralLevel:
      type: object
      required: [level, percentage, isActive, updatedAt]
      properties:
        level: { type: integer, minimum: 1, maximum: 3 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
    UpdateReferralLevelRequest:
      type: object
      required: [percentage]
      properties:
        percentage: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean }
    ReferralEarning:
      type: object
      required: [id, userId, fromUserId, rideId, level, percentage, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fromUserId: { type: string, format: uuid }
        rideId: { type: string, format: uuid }
        level: { type: integer }
        percentage: { type: number }
        amount: { type: number }
        status: { type: string, enum: [credited, reversed] }
        createdAt: { type: string, format: date-time }
        beneficiaryName: { type: string, nullable: true }
        beneficiaryPhone: { type: string, nullable: true }
        fromUserName: { type: string, nullable: true }
        fromUserPhone: { type: string, nullable: true }
    ReferralEarningsListResponse:
      type: object
      required: [earnings, total, totalAmount]
      properties:
        earnings:
          type: array
          items: { $ref: '#/components/schemas/ReferralEarning' }
        total: { type: integer }
        totalAmount: { type: number }
    ReferralByLevel:
      type: object
      required: [level, count, amount]
      properties:
        level: { type: integer }
        count: { type: integer }
        amount: { type: number }
    ReferralEarningsSummaryResponse:
      type: object
      required: [total, totalAmount, uniqueBeneficiaries, uniqueRides, byLevel]
      properties:
        total: { type: integer }
        totalAmount: { type: number }
        uniqueBeneficiaries: { type: integer }
        uniqueRides: { type: integer }
        byLevel:
          type: array
          items: { $ref: '#/components/schemas/ReferralByLevel' }
    ReferredUser:
      type: object
      required: [id, level, joinedAt, totalEarned, earningsCount]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        level: { type: integer, description: "Referral chain depth (1 = direct referral)" }
        joinedAt: { type: string, format: date-time }
        totalEarned: { type: number }
        earningsCount: { type: integer }
    ReferralsMeResponse:
      type: object
      required: [referralCode, totals, referredUsers, levels]
      properties:
        referralCode: { type: string, nullable: true }
        totals:
          type: object
          required: [total, count, byLevel]
          properties:
            total: { type: number }
            count: { type: integer }
            byLevel:
              type: array
              items: { $ref: '#/components/schemas/ReferralByLevel' }
        referredUsers:
          type: array
          items: { $ref: '#/components/schemas/ReferredUser' }
        levels:
          type: array
          items:
            type: object
            required: [level, percentage, isActive]
            properties:
              level: { type: integer }
              percentage: { type: number }
              isActive: { type: boolean }
    MlmReportSearchUser:
      type: object
      required: [id, name, phone, appMode, driverStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        referralCode: { type: string, nullable: true }
        appMode: { type: string, enum: [rider, driver] }
        driverStatus: { type: string }
    MlmReportSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/MlmReportSearchUser' }
    MlmReportNode:
      type: object
      required:
        [
          id,
          name,
          appMode,
          driverStatus,
          level,
          referralCode,
          directReferrals,
          totalEarnings,
          paidRewards,
          pendingRewards,
          joinedAt,
          isActive,
          children,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        appMode: { type: string, enum: [rider, driver] }
        driverStatus: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        referralCode: { type: string, nullable: true }
        referredByUserId: { type: string, format: uuid, nullable: true }
        directReferrals: { type: integer }
        totalEarnings: { type: number, description: 'Total referral earnings ever credited to this user (sum of referral_earnings amounts where status=credited).' }
        paidRewards: { type: number, description: 'Rewards already paid out to the wallet. Equals totalEarnings in the current schema because credited rewards are paid immediately.' }
        pendingRewards: { type: number, description: 'Rewards earned but not yet paid out. Always 0 in the current schema since there is no async payout queue — included for forward compatibility.' }
        joinedAt: { type: string, format: date-time }
        isActive: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/MlmReportNode' }
    MlmReportRoot:
      type: object
      required:
        [id, name, appMode, driverStatus, referralCode, joinedAt, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        appMode: { type: string, enum: [rider, driver] }
        driverStatus: { type: string }
        referralCode: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        isActive: { type: boolean }
    MlmReportSummary:
      type: object
      required:
        [
          level1Count,
          level2Count,
          level3Count,
          levelCounts,
          totalEarnings,
          paidRewards,
          pendingRewards,
        ]
      properties:
        level1Count: { type: integer }
        level2Count: { type: integer }
        level3Count: { type: integer }
        levelCounts:
          type: array
          description: 'Per-level downline counts, indexed by level (levelCounts[0] = level 1, etc.). Length matches the depth used to build the report.'
          items: { type: integer }
        totalEarnings: { type: number, description: 'Total referral earnings credited across the entire downline.' }
        paidRewards: { type: number, description: 'Rewards already paid out across the downline. Equals totalEarnings in the current schema.' }
        pendingRewards: { type: number, description: 'Rewards earned but not yet paid out. Always 0 in the current schema; reserved for future async payout flows.' }
    MlmReportResponse:
      type: object
      required: [root, summary, tree, depth]
      properties:
        root: { $ref: '#/components/schemas/MlmReportRoot' }
        summary: { $ref: '#/components/schemas/MlmReportSummary' }
        depth: { type: integer, minimum: 1, maximum: 6, description: 'Depth used to build this report.' }
        tree:
          type: array
          items: { $ref: '#/components/schemas/MlmReportNode' }
    MlmReportEarningRow:
      type: object
      required:
        [
          id,
          rideId,
          level,
          percentage,
          amount,
          status,
          createdAt,
          fromUserId,
        ]
      properties:
        id: { type: string, format: uuid }
        rideId: { type: string, format: uuid, nullable: true, description: 'Null when the underlying ride has since been deleted.' }
        level: { type: integer, minimum: 1, maximum: 3 }
        percentage: { type: number }
        amount: { type: number }
        status: { type: string, enum: [credited, reversed] }
        createdAt: { type: string, format: date-time }
        fromUserId: { type: string, format: uuid }
        fromUserName: { type: string, nullable: true }
        fromUserPhone: { type: string, nullable: true }
    MlmReportUserEarningsResponse:
      type: object
      required: [user, earnings, totalAmount]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string, nullable: true }
        earnings:
          type: array
          items: { $ref: '#/components/schemas/MlmReportEarningRow' }
        totalAmount: { type: number, description: 'Sum of credited earnings amounts across the returned rows.' }
    ReferralTreeNode:
      type: object
      required: [id, name, level, children]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        level: { type: integer, minimum: 1, maximum: 3 }
        children:
          type: array
          items: { $ref: '#/components/schemas/ReferralTreeNode' }
    ReferralTreeResponse:
      type: object
      required: [user, children]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/ReferralTreeNode' }
    AuthUser:
      type: object
      required: [id, phone, appMode, driverStatus]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        countryCode: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        hasPassword: { type: boolean }
        referralCode: { type: string, nullable: true }
        referredByCode: { type: string, nullable: true }
        appMode: { type: string, enum: [rider, driver] }
        driverStatus: { type: string }
        photoUrl: { type: string, nullable: true }
    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailExistsResult:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }
    AuthMe:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
    CompleteProfileRequest:
      type: object
      required: [firstName, email, password]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Must contain at least one letter and one number.
        referredByCode:
          type: string
          nullable: true
          description: Referral code of an existing user.
    DemandZone:
      type: object
      required: [lat, lng, intensity, surgeMultiplier, labelMode]
      properties:
        lat: { type: number, description: "Cell centre latitude." }
        lng: { type: number, description: "Cell centre longitude." }
        intensity:
          type: number
          minimum: 0
          maximum: 1
