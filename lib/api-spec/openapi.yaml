      tags: [Driver]
      summary: List queued ride candidates and the driver's currently queued ride
      description: |
        Returns ride candidates whose pickup is near the driver's current dropoff,
        eligible to be queued as the driver's next trip. Also returns any ride the
        driver has already queued.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queued candidates and accepted queued ride
          content:
            application/json:
              schema:
                type: object
                required: [candidates, queued]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueuedRideCandidate'
                  queued:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/QueuedRideAccepted'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
