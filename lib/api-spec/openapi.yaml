          name: rideId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [ok, ride]
                properties:
                  ok: { type: boolean }
                  ride:
                    $ref: '#/components/schemas/QueuedRideAccepted'
        '409':
          description: Already taken or driver no longer eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /system/activate-next-queued-ride:
    post:
      summary: Manually re-trigger queued-ride activation after a trip completes
      description: |
        Internal endpoint used by the driver app as a safety net to re-trigger
        activation of an accepted queued ride if the automatic activation
        inside `POST /rides/{id}/complete` failed or was missed (e.g. the
        client timed out before receiving the response). Restricted to the
        driver who completed the trip.
      operationId: activateNextQueuedRide
      tags: [QueuedRides]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateNextQueuedRideRequest'
      responses:
        '200':
          description: Activation result. `activated` is null if nothing was queued / activation no longer applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateNextQueuedRideResult'
        '400':
          description: Invalid input
        '403':
          description: Caller is not the driver of the completed trip
